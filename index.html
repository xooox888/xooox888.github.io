<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abdullah Alarifi Apps</title>
<meta name="description" content="Apps by Abdullah Alarifi, including Quiet Grid Sudoku.">
<style>
:root { --bg: #f3f5f4; --surface: #ffffff; --fg: #17211e; --muted: #56655f; --line: #d9e0dd; --accent: #146b5c; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #0e1412; --surface: #161e1c; --fg: #e3ebe8; --muted: #9aaba5; --line: #2a3633; --accent: #5cc7ad; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Arabic", Roboto, sans-serif; }
.page { max-width: 40rem; margin: 0 auto; padding-inline: 20px; padding-block: 40px 64px; }
h1 { font-size: 1.6rem; margin: 0 0 6px; }
p { color: var(--muted); margin: 0 0 24px; }
.app { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; }
.app h2 { font-size: 1.15rem; margin: 0 0 4px; }
.app p { margin: 0 0 10px; }
.links { display: flex; flex-wrap: wrap; gap: 8px 18px; }
a { color: var(--accent); }
a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<div class="page">
  <h1>Abdullah Alarifi</h1>
  <p>Apps for iPhone and iPad.</p>
  <div class="app">
    <h2>Quiet Grid Sudoku</h2>
    <p>A calm sudoku game that teaches, in English and Arabic.</p>
    <div class="links">
      <a href="https://xooox888.github.io/quietgrid-site/">Support</a>
      <a href="https://xooox888.github.io/quietgrid-site/privacy.html">Privacy policy</a>
    </div>
  </div>
</div>
</body>
</html>
